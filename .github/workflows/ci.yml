name: CI

# Runs the whole test suite on every pull request and on every push to master. The tests use an in-memory H2
# database and mocks (the "test" Spring profile), so nothing else needs to be running.
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Corretto 23 is the JDK these services are developed and tested on (the build targets Java 17).
      - uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: '23'
          cache: maven
      # mvnw is committed without the executable bit (it was added from Windows).
      - run: chmod +x mvnw
      - run: ./mvnw -B -ntp test
