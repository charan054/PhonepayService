spring.application.name=PhonepayService
server.port=8081

# Optional local file (git-ignored) holding DB_PASSWORD; see .env.example.
# Real environment variables work too and are what a server should use.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:mysql://localhost:3306/charan
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# The bank application this service calls (override with the BANK_SERVICE_URL environment variable)
bank.service.url=${BANK_SERVICE_URL:http://localhost:8080}
# Sent as X-Service-Key on every call to the bank; must be the EXACT same value as SERVICE_API_KEY on the Bank app.
bank.service.api-key=${SERVICE_API_KEY}
# Never wait forever on the bank: fail the request instead of hanging a payment
spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=5000

# How long a login stays valid
phonepe.session.ttl-minutes=30

# Only what a load balancer needs. "*" would publish heap dumps, environment and more with no login.
management.endpoints.web.exposure.include=health,info
