# Overlays src/main/resources/application.properties when the "test" profile is active.
# Points the app at an in-memory H2 database so tests never touch the real MySQL "charan" schema.
spring.datasource.url=jdbc:h2:mem:phonepetest;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Short timeouts so the "bank stopped answering" tests finish quickly
spring.cloud.openfeign.client.config.default.connect-timeout=1000
spring.cloud.openfeign.client.config.default.read-timeout=1500
